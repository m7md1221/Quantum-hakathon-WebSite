<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دليل الهاكاثون داخل الجامعة</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="guide-body">
  <div class="container guide-container">
    <div class="header">
      <img src="images/logo.png" alt="Najah AI Society Logo" class="logo">
      <h1>دليلك داخل الجامعة</h1>
      <p>اختر وجهتك وشاهد المسار على خريطة الجامعة.</p>
    </div>

    <section class="campus-guide" aria-label="دليلك داخل الجامعة">
      <div class="guide-layout">
        <div class="guide-map">
          <div class="zoom-controls-bar" style="position:absolute;top:10px;left:10px;z-index:10;display:flex;gap:8px;">
            <button id="zoom-in" class="zoom-btn" title="تكبير">+</button>
            <button id="zoom-out" class="zoom-btn" title="تصغير">-</button>
            <button id="fullscreen-btn" class="zoom-btn" title="ملء الشاشة">⛶</button>
            <button id="exit-fullscreen-btn" class="zoom-btn" title="الخروج من ملء الشاشة" style="display:none;">✕</button>
                    <style>
                      .guide-map {
                        position: relative;
                        width: 90vw;
                        height: 60vh;
                        max-width: 700px;
                        max-height: 500px;
                        margin: 0 auto;
                        padding: 0;
                        background: #fff;
                        box-sizing: border-box;
                        overflow: hidden;
                        display: flex;
                        align-items: stretch;
                        justify-content: stretch;
                        border-radius: 12px;
                        box-shadow: 0 2px 12px #0001;
                      }
                      .zoom-controls-bar {
                        position: absolute;
                        top: 16px;
                        left: 16px;
                        z-index: 10;
                        display: flex;
                        flex-direction: row;
                        gap: 10px;
                        background: rgba(255,255,255,0.85);
                        border-radius: 8px;
                        box-shadow: 0 2px 8px #0002;
                        padding: 6px 10px;
                        align-items: center;
                        font-size: 1.1rem;
                      }
                      .zoom-btn {
                        background: #f3f4f6;
                        border: 1px solid #d1d5db;
                        border-radius: 6px;
                        width: 38px;
                        height: 38px;
                        font-size: 1.5rem;
                        font-weight: bold;
                        color: #222;
                        cursor: pointer;
                        box-shadow: 0 1px 4px #0001;
                        transition: background 0.2s, border 0.2s;
                        outline: none;
                      }
                      @media (max-width: 600px) {
                        .guide-map {
                          width: calc(88vw - 0.5cm);
                          height: 28vh;
                          max-width: calc(92vw - 0.5cm);
                          max-height: 120px;
                          border-radius: 6px;
                          box-shadow: 0 1px 4px #0001;
                        }
                        .zoom-controls-bar {
                          top: 4px;
                          left: 4px;
                          padding: 2px 4px;
                          gap: 2px;
                          border-radius: 4px;
                          font-size: 0.9rem;
                        }
                        .zoom-btn {
                          width: 20px;
                          height: 20px;
                          font-size: 0.9rem;
                          border-radius: 3px;
                        }
                      }
                      .zoom-container {
                        width: 100%;
                        height: 100%;
                        margin: 0;
                        padding: 0;
                        position: relative;
                        overflow: hidden;
                        background: #fff;
                        box-sizing: border-box;
                      }
                      .campus-image, .campus-overlay {
                        position: absolute;
                        left: 0;
                        top: 0;
                        width: 100%;
                        height: 100%;
                        max-width: none;
                        max-height: none;
                        min-width: 100%;
                        min-height: 100%;
                        display: block;
                        user-select: none;
                        margin: 0;
                        padding: 0;
                        border: none;
                        box-sizing: border-box;
                        transition: transform 0.2s;
                      }
                      .campus-image {
                        cursor: grab;
                        z-index: 1;
                      }
                      .campus-overlay {
                        pointer-events: none;
                        z-index: 2;
                      }
                      .zoom-controls-bar {
                        position: absolute;
                        top: 16px;
                        left: 16px;
                        z-index: 10;
                        display: flex;
                        flex-direction: row;
                        gap: 10px;
                        background: rgba(255,255,255,0.85);
                        border-radius: 8px;
                        box-shadow: 0 2px 8px #0002;
                        padding: 6px 10px;
                        align-items: center;
                      }
                      .zoom-btn {
                        background: #f3f4f6;
                        border: 1px solid #d1d5db;
                        border-radius: 6px;
                        width: 38px;
                        height: 38px;
                        font-size: 1.5rem;
                        font-weight: bold;
                        color: #222;
                        cursor: pointer;
                        box-shadow: 0 1px 4px #0001;
                        transition: background 0.2s, border 0.2s;
                        outline: none;
                      }
                      .zoom-btn:active {
                        background: #e5e7eb;
                        border-color: #a1a1aa;
                      }
                      .zoom-btn:disabled {
                        opacity: 0.5;
                        cursor: not-allowed;
                      }
                    </style>
          </div>
          <img id="guide-main-image" src="images/campus-aerial.jpg" alt="خريطة جوية لجامعة النجاح" class="campus-image">
          <svg class="campus-overlay" viewBox="0 0 1126 763" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
            <g id="routeGroup">
              <path id="routePath" d="" />
              <circle id="routeStart" cx="0" cy="0" r="10" />
              <circle id="routeEnd" cx="0" cy="0" r="10" />
            </g>
          </svg>
        </div>

        <div class="guide-controls">       
           <button class="guide-btn" data-destination="zafer_theater">الباصات -> مدرج ظافر المصري</button>
          <button class="guide-btn" data-destination="innovation_garden">مدرج ظافر المصري -> حديقة النجاح </button>
          <button class="guide-btn" data-destination="library">مدرج ظافر المصري -> مكتبة الجامعة</button>
          <button class="guide-btn" data-destination="bank">مدرج ظافر المصري -> البنك</button>
          <button class="guide-btn" data-destination="restrooms">مدرج ظافر المصري -> حمامات الجامعة</button>
                    <button class="guide-btn" data-destination="garden_restrooms">حمامات حديقة النجاح </button>
          <button class="guide-btn" data-destination="cafeteria">مدرج ظافر المصري -> الكافتيريا</button>
          <a href="https://virtualtour.najah.edu/" target="_blank" rel="noopener" class="guide-link">استكشف الجامعة بتقنية 360°</a>
          <a href="login.html" class="guide-link secondary">العودة لصفحة الترحيب</a>
        </div>
      </div>
    </section>
  </div>

  <script src="js/page-transitions.js"></script>
  <script>
    // Zoom & Pan functionality with buttons and fullscreen
    const zoomContainer = document.querySelector('.guide-map');
    const campusImage = document.getElementById('guide-main-image');
    const campusOverlay = document.querySelector('.campus-overlay');
    const zoomInBtn = document.getElementById('zoom-in');
    const zoomOutBtn = document.getElementById('zoom-out');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const exitFullscreenBtn = document.getElementById('exit-fullscreen-btn');
    let scale = 1;
    let posX = 0, posY = 0;
    let isDragging = false;
    let startX, startY;

    function getMinScale() {
      const containerRect = zoomContainer.getBoundingClientRect();
      const imgNaturalWidth = campusImage.naturalWidth;
      const imgNaturalHeight = campusImage.naturalHeight;
      // بدون أي هامش إضافي
      const minScaleX = containerRect.width / imgNaturalWidth;
      const minScaleY = containerRect.height / imgNaturalHeight;
      return Math.max(minScaleX, minScaleY);
    }

    function setTransform() {
      const containerRect = zoomContainer.getBoundingClientRect();
      const imgWidth = campusImage.naturalWidth * scale;
      const imgHeight = campusImage.naturalHeight * scale;
      let minX, maxX, minY, maxY;
      if (imgWidth <= containerRect.width) {
        minX = maxX = 0;
        posX = 0;
      } else {
        minX = -(imgWidth - containerRect.width);
        maxX = 0;
        posX = Math.max(minX, Math.min(posX, maxX));
      }
      if (imgHeight <= containerRect.height) {
        minY = maxY = 0;
        posY = 0;
      } else {
        minY = -(imgHeight - containerRect.height);
        maxY = 0;
        posY = Math.max(minY, Math.min(posY, maxY));
      }
      campusImage.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
      campusOverlay.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
      // تعطيل زر التصغير إذا كنا على الحد الأدنى
      const minScale = getMinScale();
      zoomOutBtn.disabled = scale <= minScale + 0.001;
      zoomInBtn.disabled = scale >= 3;
    }

    // أزرار التكبير والتصغير
    zoomInBtn.addEventListener('click', function() {
      const minScale = getMinScale();
      scale = Math.min(scale + 0.15, 3);
      if (scale < minScale) scale = minScale;
      setTransform();
      // تفعيل التحريك اليدوي عند التكبير
      if (scale > minScale + 0.001) {
        zoomContainer.onmousedown = function(e) {
          isDragging = true;
          startX = e.clientX - posX;
          startY = e.clientY - posY;
          campusImage.style.cursor = 'grabbing';
        };
        zoomContainer.ontouchstart = function(e) {
          if (e.touches.length === 1) {
            isDragging = true;
            startX = e.touches[0].clientX - posX;
            startY = e.touches[0].clientY - posY;
          }
        };
      } else {
        zoomContainer.onmousedown = null;
        zoomContainer.ontouchstart = null;
      }
      // إضافة أحداث التحريك
      document.onmousemove = function(e) {
        if (!isDragging) return;
        posX = e.clientX - startX;
        posY = e.clientY - startY;
        setTransform();
      };
      document.onmouseup = function() {
        if (isDragging) {
          isDragging = false;
          campusImage.style.cursor = 'grab';
        }
      };
      document.ontouchmove = function(e) {
        if (!isDragging || e.touches.length !== 1) return;
        posX = e.touches[0].clientX - startX;
        posY = e.touches[0].clientY - startY;
        setTransform();
      };
      document.ontouchend = function() {
        if (isDragging) {
          isDragging = false;
          campusImage.style.cursor = 'grab';
        }
      };
    });
    zoomOutBtn.addEventListener('click', function() {
      let minScale = getMinScale();
      if (campusImage.src.includes('garden-restrooms2.jpg') || campusImage.src.includes('campus-aerial.jpg')) {
        minScale = 1.1432;
      }
      if (campusImage.src.includes('campus-aerial.jpg') && scale - 0.15 < 1.1432) {
        scale = 1.1432;
      } else {
        scale = Math.max(scale - 0.15, minScale);
      }
      setTransform();
      // تعطيل الزر إذا وصل للحد الأدنى
      zoomOutBtn.disabled = scale <= minScale + 0.001;
      // تعطيل التحريك اليدوي إذا وصل للحد الأدنى
      if (scale <= minScale + 0.001) {
        zoomContainer.onmousedown = null;
        zoomContainer.ontouchstart = null;
        document.onmousemove = null;
        document.onmouseup = null;
        document.ontouchmove = null;
        document.ontouchend = null;
      }
    });

    // ملء الشاشة
    fullscreenBtn.addEventListener('click', function() {
      if (zoomContainer.requestFullscreen) {
        zoomContainer.requestFullscreen();
      } else if (zoomContainer.webkitRequestFullscreen) {
        zoomContainer.webkitRequestFullscreen();
      } else if (zoomContainer.msRequestFullscreen) {
        zoomContainer.msRequestFullscreen();
      }
    });
    exitFullscreenBtn.addEventListener('click', function() {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      } else if (document.msExitFullscreen) {
        document.msExitFullscreen();
      }
    });

    // إظهار/إخفاء زر الخروج من ملء الشاشة
    function updateFullscreenButtons() {
      if (document.fullscreenElement === zoomContainer || document.webkitFullscreenElement === zoomContainer || document.msFullscreenElement === zoomContainer) {
        fullscreenBtn.style.display = 'none';
        exitFullscreenBtn.style.display = '';
      } else {
        fullscreenBtn.style.display = '';
        exitFullscreenBtn.style.display = 'none';
      }
    }
    document.addEventListener('fullscreenchange', updateFullscreenButtons);
    document.addEventListener('webkitfullscreenchange', updateFullscreenButtons);
    document.addEventListener('msfullscreenchange', updateFullscreenButtons);

    // تم إلغاء التحريك اليدوي للصورة نهائياً

    // إعادة ضبط عند تغيير حجم النافذة
    window.addEventListener('resize', function() {
      setTransform();
    });

    // عند تحميل الصورة لأول مرة
    campusImage.onload = function() {
      scale = getMinScale();
      posX = 0;
      posY = 0;
      setTransform();
      // تعطيل زر التصغير عند الحد الأدنى وتفعيل زر التكبير دائماً
      let minScale = getMinScale();
      if (campusImage.src.includes('garden-restrooms2.jpg')) {
        minScale = 1.1432;
      }
      // تعطيل زر التصغير للصورة الأولى عندما يكون scale قريب من 1.1432 أو قريب من الحد الأدنى (مرتين بعد نقطة البداية)
      if (campusImage.src.includes('campus-aerial.jpg') && (Math.abs(scale - 1.1432) < 0.001 || scale <= minScale + 0.16)) {
        zoomOutBtn.disabled = true;
      } else {
        zoomOutBtn.disabled = scale <= minScale + 0.001;
      }
      zoomInBtn.disabled = false;
    };
    // إذا كانت الصورة محملة مسبقاً
    if (campusImage.complete) {
      campusImage.onload();
    }
  </script>
  <script>
    const routes = {
      innovation_garden: {
        path: 'M37.5 0.0192184C36.7 20.8192 37.1667 26.0192 37.5 26.0192H0.5V134.019L155 149.519L228.5 224.019L223 286.019H183V293.519',
        start: { x: 37.5, y: 0.0192184 },
        end: { x: 183, y: 293.519 },
        transform: { scaleX: 1, scaleY: 1, translateX: 355, translateY: 455 }
      },
      garden_restrooms: {
        path: 'M45.3927 25.5C33.7927 55.1 30.8927 62.5 30.8927 62.5L0.8927 89L116.893 145.5L297.893 13.5V0', // مسار جديد للحمامات في الحديقة
        start: { x: 45.3927, y: 25.5 },
        end: { x: 297.893, y: 0 },
        transform: { scaleX: 1, scaleY: 1, translateX: 680, translateY: 500 },
        image: 'images/garden-restrooms2.jpg' // صورة جديدة مخصصة للحمامات في الحديقة
      },
      zafer_theater: {
        path: 'M36.5 0.941721C7.7 0.141721 0.5 0.608388 0.5 0.941721L15 205.942H128L52 259.942V241.942',
        start: { x: 36.5, y: 0.941721 },
        end: { x: 52, y: 241.942 },
        transform: { scaleX: 1, scaleY: 1, translateX: 330, translateY: 220 }
      },
      library: {
          path: 'M63.5 34C64.3 52 63.8333 56.5 63.5 56.5L138.5 0.5H0',
        start: { x: 63.5, y: 34 },
        end: { x: 0, y: 0 },
        transform: { scaleX: 1, scaleY: 1, translateX: 330, translateY: 430 }
      },
      bank: {
        path: 'M50 0C50 21.2 50 26.5 50 26.5H0.5V0',
        start: { x: 50, y: 0 },
        end: { x: 0.5, y: 0 },
        transform: { scaleX: 1, scaleY: 1, translateX: 340, translateY: 460 }
      },
      restrooms: {
        path: 'M62.5 0.0120468C61.7 33.212 62.1667 41.512 62.5 41.512M62.5 41.512H0M62.5 41.512L86 5.01205L505.5 12.512V0.0120468',
        start: { x: 62.5, y: 0.0120468 },
         end: [
           { x: 505.5, y: 0.0120468 },
           { x: 0, y: 41.512 }
         ],
        transform: { scaleX: 1, scaleY: 1, translateX: 330, translateY: 460 }
      },
      cafeteria: {
        path: 'M60 0.534042C61.2 26.934 60.5 39.8674 60 43.034M60 43.034H0M60 43.034C78 9.03404 82.5 0.534042 82.5 0.534042L278.5 22.034V0.534042',
        start: { x: 60, y: 0.534042 },
        end: [
          { x: 278.5, y: 0.534042 },
          { x: 0, y: 43.034 }
        ],
        transform: { scaleX: 1, scaleY: 1, translateX: 330, translateY: 460 }
      }
    };

    const routeGroup = document.getElementById('routeGroup');
    const routePath = document.getElementById('routePath');
    const routeStart = document.getElementById('routeStart');
    const routeEnd = document.getElementById('routeEnd');

    function showRoute(destinationKey) {
      const route = routes[destinationKey];
      if (!route) return;

      // تغيير الصورة حسب الوجهة
      const mainImage = document.getElementById('guide-main-image');
      if (destinationKey === 'garden_restrooms' && route.image) {
        mainImage.src = route.image;
        mainImage.alt = 'حمامات حديقة النجاح';
        mainImage.style.margin = '0';
        mainImage.style.padding = '0';
        mainImage.style.border = 'none';
        mainImage.style.boxSizing = 'border-box';
        mainImage.style.width = '100%';
        mainImage.style.height = '100%';
        mainImage.style.maxWidth = 'none';
        mainImage.style.maxHeight = 'none';
        mainImage.style.minWidth = '100%';
        mainImage.style.minHeight = '100%';
        mainImage.style.display = 'block';
        mainImage.style.position = 'absolute';
        mainImage.style.left = '0';
        mainImage.style.top = '0';
        mainImage.style.cursor = 'grab';
        // ضبط التكبير ليبدأ من الحد الأدنى المناسب
        setTimeout(() => {
          scale = 1.1432;
          posX = 0;
          posY = 0;
          setTransform();
          zoomOutBtn.disabled = true;
          zoomInBtn.disabled = false;
        }, 50);
        // تعطيل السحب والتكبير اليدوي
        zoomContainer.onmousedown = null;
        zoomContainer.ontouchstart = null;
      } else {
        mainImage.src = 'images/campus-aerial.jpg';
        mainImage.alt = 'خريطة جوية لجامعة النجاح';
        mainImage.style.margin = '0';
        mainImage.style.padding = '0';
        mainImage.style.border = 'none';
        mainImage.style.boxSizing = 'border-box';
        mainImage.style.width = '100%';
        mainImage.style.height = '100%';
        mainImage.style.maxWidth = 'none';
        mainImage.style.maxHeight = 'none';
        mainImage.style.minWidth = '100%';
        mainImage.style.minHeight = '100%';
        mainImage.style.display = 'block';
        mainImage.style.position = 'absolute';
        mainImage.style.left = '0';
        mainImage.style.top = '0';
        mainImage.style.cursor = 'grab';
        setTimeout(() => {
          scale =  1.1432;
          posX = 0;
          posY = 0;
          setTransform();
          zoomOutBtn.disabled = true;
          zoomInBtn.disabled = false;
        }, 50);
        // تفعيل السحب والتكبير اليدوي
        zoomContainer.onmousedown = function(e) {
          if (scale <= getMinScale() + 0.001) return;
          isDragging = true;
          startX = e.clientX - posX;
          startY = e.clientY - posY;
          campusImage.style.cursor = 'grabbing';
        };
        zoomContainer.ontouchstart = function(e) {
          if (scale <= getMinScale() + 0.001) return;
          if (e.touches.length === 1) {
            isDragging = true;
            startX = e.touches[0].clientX - posX;
            startY = e.touches[0].clientY - posY;
          }
        };
      }

      const transform = route.transform || { scaleX: 1, scaleY: 1, translateX: 0, translateY: 0 };
      const scaleX = transform.scaleX ?? 1;
      const scaleY = transform.scaleY ?? 1;
      const translateX = transform.translateX ?? 0;
      const translateY = transform.translateY ?? 0;

      routeGroup.setAttribute('transform', `translate(${translateX} ${translateY}) scale(${scaleX} ${scaleY})`);

      routePath.setAttribute('d', route.path);
      routeStart.setAttribute('cx', route.start.x);
      routeStart.setAttribute('cy', route.start.y);
      routeStart.setAttribute('r', '12');
      routeStart.setAttribute('fill', '#ef4444');
      routeStart.setAttribute('stroke', '#ffffff');
      routeStart.setAttribute('stroke-width', '4');

      const extraEnds = routeGroup.querySelectorAll('.route-end-extra');
      extraEnds.forEach(node => node.remove());

      const endPoints = Array.isArray(route.end) ? route.end : [route.end];
      const primaryEnd = endPoints[0];

      routeEnd.setAttribute('cx', primaryEnd.x);
      routeEnd.setAttribute('cy', primaryEnd.y);
      routeEnd.setAttribute('r', '12');
      routeEnd.setAttribute('fill', '#22c55e');
      routeEnd.setAttribute('stroke', '#ffffff');
      routeEnd.setAttribute('stroke-width', '4');

      endPoints.slice(1).forEach(point => {
        const extra = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        extra.setAttribute('class', 'route-end-extra');
        extra.setAttribute('cx', point.x);
        extra.setAttribute('cy', point.y);
        extra.setAttribute('r', '12');
        extra.setAttribute('fill', '#22c55e');
        extra.setAttribute('stroke', '#ffffff');
        extra.setAttribute('stroke-width', '4');
        routeGroup.appendChild(extra);
      });

      routePath.classList.remove('animate');
      void routePath.offsetWidth;
      routePath.classList.add('animate');
    }

    document.querySelectorAll('.guide-btn').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('.guide-btn').forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');
        showRoute(button.dataset.destination);
      });
    });

    showRoute('innovation_garden');
    document.querySelector('.guide-btn[data-destination="innovation_garden"]')?.classList.add('active');
  </script>
</body>
</html>
