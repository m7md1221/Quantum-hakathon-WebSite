<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Judge Dashboard - Quantum Hackathon</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="container">
    <div class="header">
      <img src="images/logo.png" alt="Najah AI Society Logo" class="logo">
      <h1>Judge Dashboard</h1>
      <p id="judge-info" style="font-size: 1.2rem; margin-top: 10px; font-weight: 500; color: var(--primary-color);">
        Welcome, <span id="judge-name">Loading...</span>
      </p>
      <p>Evaluate teams in your assigned hall</p>
    </div>

    <div class="card">
      <h2>Your Hall: <span id="hall" style="color: var(--primary-color); font-weight: 700;"></span></h2>
    </div>

    <div class="card">
      <h2>Teams to Evaluate</h2>
      <div id="teams-loading">Loading teams...</div>
      <div id="teams-container" class="grid grid-3" style="display: none;"></div>
    </div>

    <div style="text-align: center; margin-top: 20px;">
      <button id="logout" class="btn btn-secondary">Logout</button>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-bottom">
      <p>&copy; An-Najah Artificial Intelligence Society - NAI</p>
      <a href="https://www.linkedin.com/in/mohammad-dawabsheh-193050308/" target="_blank" rel="noopener noreferrer" class="dev-icon" title="Mohammad Dawabsheh - Developer">
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M20.5 2h-17A1.5 1.5 0 002 3.5v17A1.5 1.5 0 003.5 22h17a1.5 1.5 0 001.5-1.5v-17A1.5 1.5 0 0020.5 2zM8 19H5v-9h3zM6.5 8.25A1.75 1.75 0 118.3 6.5a1.78 1.78 0 01-1.8 1.75zM19 19h-3v-4.74c0-1.42-.6-1.93-1.38-1.93A1.74 1.74 0 0013 14.19a.66.66 0 000 .14V19h-3v-9h2.9v1.3a3.11 3.11 0 012.7-1.4c1.55 0 3.36.86 3.36 3.66z"/>
        </svg>
      </a>
    </div>
  </footer>

  <script src="js/page-transitions.js"></script>
  <script src="judge.js"></script>
</body>

</html>
