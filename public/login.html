<!DOCTYPE html>
<html lang="ar" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Judge Portal - Quantum Hackathon</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      color: #0f172a;
    }

    .min-h-screen {
      min-height: 100vh;
      width: 100%;
      background-color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    .bg-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #4b4e9e 0%, #2d153d 100%);
      opacity: 1;
    }

    .geometric-shards {
      position: absolute;
      inset: 0;
      opacity: 0.2;
      pointer-events: none;
    }

    .shard-1 {
      position: absolute;
      top: -10%;
      right: -5%;
      width: 60%;
      height: 70%;
      background: rgba(255, 255, 255, 0.05);
      transform: skewY(12deg) rotate(12deg);
      filter: blur(60px);
      animation: float 8s infinite ease-in-out;
    }

    .shard-2 {
      position: absolute;
      bottom: -20%;
      left: -10%;
      width: 50%;
      height: 60%;
      background: rgba(139, 92, 246, 0.1);
      transform: skewY(-6deg) rotate(-6deg);
      filter: blur(60px);
      animation: float-reverse 10s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% {
        transform: skewY(12deg) rotate(12deg) translateY(0);
      }
      50% {
        transform: skewY(12deg) rotate(12deg) translateY(-20px);
      }
    }

    @keyframes float-reverse {
      0%, 100% {
        transform: skewY(-6deg) rotate(-6deg) translateY(0);
      }
      50% {
        transform: skewY(-6deg) rotate(-6deg) translateY(20px);
      }
    }

    .neural-particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .particle {
      position: absolute;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      animation: float-particle infinite ease-in-out;
    }

    @keyframes float-particle {
      0% {
        transform: translate(0, 0) scale(1);
        opacity: 0;
      }
      25% {
        opacity: 0.6;
      }
      50% {
        transform: translate(60px, -80px) scale(1.2);
        opacity: 0.4;
      }
      75% {
        opacity: 0.6;
      }
      100% {
        transform: translate(120px, -160px) scale(1);
        opacity: 0;
      }
    }

    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1100px;
      min-height: 650px;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(60px);
      border-radius: 40px;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
      display: flex;
      overflow: hidden;
      opacity: 0;
      transform: translateY(48px);
      animation: fade-in 1s forwards;
    }

    @keyframes fade-in {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .left-panel {
      flex: 1;
      background-color: #3a1c5d;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      position: relative;
      overflow: hidden;
    }

    .facets-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.2;
    }

    .neural-network {
      position: relative;
      width: 280px;
      height: 280px;
      margin: 0 auto 2rem;
      animation: gentle-drift 10s infinite ease-in-out;
    }

    @keyframes gentle-drift {
      0%, 100% {
        transform: translateY(0) translateX(0) rotate(0deg);
      }
      33% {
        transform: translateY(-10px) translateX(5px) rotate(1deg);
      }
      66% {
        transform: translateY(5px) translateX(-5px) rotate(-1deg);
      }
    }

    .network-node {
      position: absolute;
      background: white;
      border-radius: 50%;
      transition: all 1s;
    }

    .network-node.glow {
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.9);
      animation: neuron-pulse 3s infinite ease-in-out;
    }

    .network-node.no-glow {
      opacity: 0.4;
      animation: pulse-soft 5s infinite ease-in-out;
    }

    @keyframes neuron-pulse {
      0%, 100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.8;
      }
      50% {
        transform: translate(-50%, -50%) scale(1.25);
        opacity: 1;
      }
    }

    @keyframes pulse-soft {
      0%, 100% {
        opacity: 0.4;
      }
      50% {
        opacity: 0.6;
      }
    }

    .network-line {
      stroke: white;
      stroke-width: 0.8;
      opacity: 0.2;
      animation: pulse-line 4s infinite ease-in-out;
    }

    @keyframes pulse-line {
      0%, 100% {
        opacity: 0.1;
      }
      50% {
        opacity: 0.3;
      }
    }

    .left-panel h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: 0.5rem;
      text-align: center;
      line-height: 1.2;
      position: relative;
      z-index: 10;
    }

    .divider {
      width: 5rem;
      height: 3px;
      background: rgba(255, 255, 255, 0.3);
      margin: 0 auto 1rem;
      border-radius: 9999px;
    }

    .subtitle {
      font-size: 1rem;
      color: rgba(216, 180, 254, 1);
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
      text-align: center;
    }

    .welcome-text {
      color: rgba(255, 255, 255, 0.8);
      max-width: 24rem;
      line-height: 1.5;
      font-size: 0.9rem;
      text-align: center;
    }

    .right-panel {
      flex: 1;
      padding: 3rem 2.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: white;
    }

    .logo-container {
      display: flex;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    .portal-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: #2d153d;
      margin-bottom: 0.25rem;
      text-align: center;
    }

    .portal-subtitle {
      color: #64748b;
      text-align: center;
      margin-bottom: 2rem;
      font-size: 1rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.7rem;
      font-weight: 900;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 0.5rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.8rem 1.2rem;
      background-color: #f8fafc;
      border: 2px solid #f1f5f9;
      border-radius: 0.75rem;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-group input:focus {
      border-color: #8b5cf6;
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .support-link {
      color: #4a235a;
      text-decoration: none;
      font-weight: 600;
    }

    .sign-in-btn {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(to right, #4a235a, #3f51b5);
      color: white;
      font-weight: 900;
      font-size: 1.1rem;
      border-radius: 0.75rem;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(74, 35, 90, 0.3);
      transition: all 0.3s;
    }

    .sign-in-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 40px rgba(74, 35, 90, 0.4);
    }

    #message {
      margin-top: 1rem;
      font-size: 0.9rem;
      text-align: center;
      color: #b91c1c;
      min-height: 1.25rem;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        max-width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="min-h-screen">
    <div class="bg-gradient"></div>
    <div class="geometric-shards">
      <div class="shard-1"></div>
      <div class="shard-2"></div>
    </div>
    <div class="neural-particles" id="neuralParticles"></div>

    <div class="container">
      <div class="left-panel">
        <div class="facets-overlay">
          <svg width="100%" height="100%" viewBox="0 0 400 600">
            <path d="M0,0 L400,100 L200,600 L0,500 Z" fill="rgba(255,255,255,0.05)" />
            <path d="M400,0 L100,200 L300,500 L400,400 Z" fill="rgba(255,255,255,0.03)" />
          </svg>
        </div>

        <div class="neural-network" id="neuralNetwork">
          <svg style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.1;" viewBox="0 0 300 300">
            <path d="M0,100 L150,50 L300,120 L200,250 L50,280 Z" fill="none" stroke="white" stroke-width="0.5" />
            <path d="M100,0 L250,80 L200,200 L0,150 Z" fill="none" stroke="white" stroke-width="0.5" />
          </svg>
          <svg style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: visible;" id="connectionLines"></svg>
          <div id="nodesContainer"></div>
        </div>

        <div style="position: relative; z-index: 10; text-align: center;">
          <h1>Quantum<br>Hackathon</h1>
          <div class="divider"></div>
          <p class="subtitle">AI &amp; QUANTUM INNOVATION</p>
          <p class="welcome-text">Welcome, Judge. Excellence awaits your assessment.</p>
        </div>
      </div>

      <div class="right-panel">
        <div class="logo-container">
          <svg width="200" height="100" viewBox="0 0 450 250">
            <g transform="translate(40, 40)">
              <circle cx="15" cy="15" r="6" fill="#4a235a" />
              <path d="M15,15 C-20,60 -10,120 40,125 C80,130 140,110 160,50 C175,0 120,-20 80,-10 C50,0 35,40 50,70" fill="none" stroke="#4a235a" stroke-width="11" stroke-linecap="round" />
              <path d="M130,50 C140,80 160,130 130,160 C100,190 75,150 70,110 C65,70 100,60 120,80 C140,100 135,140 100,200" fill="none" stroke="#3f51b5" stroke-width="11" stroke-linecap="round" />
            </g>
            <text x="220" y="145" font-family="Arial" font-size="56" font-weight="900" fill="#4a235a">NAI</text>
            <text x="220" y="195" font-family="Arial" font-size="30" fill="#3f51b5" font-weight="700">Najah AI SOCIETY</text>
          </svg>
        </div>

        <h2 class="portal-title">Judge Portal</h2>
        <p class="portal-subtitle">Enter your credentials to continue</p>

        <form id="loginForm">
          <div class="form-group">
            <label for="email">EMAIL</label>
            <input type="email" id="email" placeholder="judge@quantum.ai" required />
          </div>
          <div class="form-group">
            <label for="password">PASSWORD</label>
            <input type="password" id="password" placeholder="••••••••" required />
          </div>
          <div class="form-options">
            <div class="remember-me">
              <input type="checkbox" id="remember" />
              <label for="remember" style="font-size: 0.8rem; margin-left: 5px;">Remember Login</label>
            </div>
            <a href="#" class="support-link" style="font-size: 0.8rem;">Support</a>
          </div>
          <button type="submit" class="sign-in-btn">SIGN IN</button>
          <div id="message"></div>
        </form>
      </div>
    </div>
  </div>

  <script>
    const nodes = [
      { x: 40, y: 60, size: 4, glow: true },
      { x: 120, y: 50, size: 6, glow: true },
      { x: 200, y: 80, size: 5, glow: false },
      { x: 270, y: 110, size: 4, glow: true },
      { x: 40, y: 120, size: 5, glow: false },
      { x: 120, y: 130, size: 7, glow: true },
      { x: 200, y: 150, size: 6, glow: true },
      { x: 270, y: 170, size: 5, glow: false },
      { x: 45, y: 190, size: 4, glow: true },
      { x: 125, y: 200, size: 6, glow: true },
      { x: 205, y: 230, size: 6, glow: true },
      { x: 275, y: 240, size: 4, glow: false },
      { x: 42, y: 250, size: 4, glow: false },
      { x: 48, y: 290, size: 4, glow: true }
    ];

    const connections = [
      [0, 1], [0, 5], [1, 2], [1, 5], [1, 6], [2, 3], [2, 6], [2, 7],
      [4, 5], [4, 9], [5, 6], [5, 10], [6, 7], [6, 10], [6, 11],
      [8, 9], [8, 12], [9, 10], [10, 11], [10, 13], [12, 13]
    ];

    const connectionLines = document.getElementById('connectionLines');
    connections.forEach(([from, to], idx) => {
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', nodes[from].x);
      line.setAttribute('y1', nodes[from].y);
      line.setAttribute('x2', nodes[to].x);
      line.setAttribute('y2', nodes[to].y);
      line.classList.add('network-line');
      line.style.animationDelay = `${idx * 0.1}s`;
      connectionLines.appendChild(line);
    });

    const nodesContainer = document.getElementById('nodesContainer');
    nodes.forEach((node, i) => {
      const nodeDiv = document.createElement('div');
      nodeDiv.className = `network-node ${node.glow ? 'glow' : 'no-glow'}`;
      nodeDiv.style.left = `${node.x}px`;
      nodeDiv.style.top = `${node.y}px`;
      nodeDiv.style.width = `${node.size * 1.5}px`;
      nodeDiv.style.height = `${node.size * 1.5}px`;
      nodeDiv.style.transform = 'translate(-50%, -50%)';
      nodeDiv.style.animationDelay = `${i * 0.2}s`;
      nodesContainer.appendChild(nodeDiv);
    });

    const neuralParticles = document.getElementById('neuralParticles');
    for (let i = 0; i < 35; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      const size = Math.random() * 4 + 1;
      particle.style.width = size + 'px';
      particle.style.height = size + 'px';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.top = Math.random() * 100 + '%';
      particle.style.animationDuration = (8 + Math.random() * 15) + 's';
      particle.style.animationDelay = (Math.random() * -20) + 's';
      neuralParticles.appendChild(particle);
    }
  </script>
  <script src="auth.js"></script>
</body>

</html>
